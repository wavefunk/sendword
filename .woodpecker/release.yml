when:
  - event: tag
    ref: refs/tags/v*

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.9.0
    settings:
      partial: false
      depth: 0
      lfs: false
      recursive: false

steps:
  - name: validate-release
    image: git.wavefunk.io/wavefunk/ci-rust:nightly-2026-01-05
    pull: true
    volumes:
      - sendword-release-cache:/woodpecker-cache
    commands:
      - mkdir -p /woodpecker-cache/target
      - rm -rf target
      - ln -s /woodpecker-cache/target target
      - sh scripts/ci/validate-release-tag.sh

  - name: build-artifacts
    image: git.wavefunk.io/wavefunk/ci-rust:nightly-2026-01-05
    pull: true
    depends_on: [validate-release]
    environment:
      CARGO_HOME: /woodpecker-cache/cargo
      R2_BUCKET: sendword-releases
      R2_PUBLIC_BASE_URL: https://releases.sendword.online
      RUST_TOOLCHAIN: nightly-2026-01-05
    volumes:
      - sendword-release-cache:/woodpecker-cache
    commands:
      - mkdir -p /woodpecker-cache/cargo /woodpecker-cache/target
      - rm -rf target
      - ln -s /woodpecker-cache/target target
      - sh scripts/ci/build-release-artifacts.sh

  - name: upload-r2
    image: git.wavefunk.io/wavefunk/ci-node:node-22-wrangler-4.91.0
    pull: true
    depends_on: [build-artifacts]
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: cloudflare_api_token
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: cloudflare_account_id
      R2_BUCKET: sendword-releases
      WRANGLER_BIN: /usr/local/bin/wrangler
    volumes:
      - sendword-release-cache:/woodpecker-cache
    commands:
      - mkdir -p /woodpecker-cache/docker-buildx /woodpecker-cache/target
      - rm -rf target
      - ln -s /woodpecker-cache/target target
      - test -s target/release-upload/sendword-installer.sh
      - sh scripts/ci/upload-r2-release.sh

  - name: publish-docker
    image: woodpeckerci/plugin-docker-buildx:5.1.0
    privileged: true
    depends_on: [upload-r2]
    volumes:
      - sendword-release-cache:/woodpecker-cache
    settings:
      cache_from:
        - type=local\,src=/woodpecker-cache/docker-buildx
      cache_to: type=local,dest=/woodpecker-cache/docker-buildx,mode=max
      registry: ghcr.io
      repo: ghcr.io/wavefunk/sendword
      target: release-runtime
      tags:
        - ${CI_COMMIT_TAG##v}
        - latest
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
